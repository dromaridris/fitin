services:
  db:
    image: postgres:16
    container_name: smart_recipe_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_recipe
      POSTGRES_USER: smart_recipe
      POSTGRES_PASSWORD: smart_recipe_dev
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_recipe -d smart_recipe"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    container_name: smart_recipe_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://smart_recipe:smart_recipe_dev@db:5432/smart_recipe
      APP_ENV: production
      CORS_ORIGINS: "*"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  seed:
    build: ./backend
    container_name: smart_recipe_seed
    environment:
      DATABASE_URL: postgresql+psycopg://smart_recipe:smart_recipe_dev@db:5432/smart_recipe
    command: ["python", "-m", "app.seed"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
